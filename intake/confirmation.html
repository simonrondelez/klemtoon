<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Logopedie De Klemtoon">
  <meta name="description" content="Bevestiging intake - Logopediepraktijk De Klemtoon Oudenaarde" />
  <title>Bevestiging - Logopediepraktijk De Klemtoon</title>

  <!-- Bootstrap Core CSS -->
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="../css/agency.css" rel="stylesheet">
  <!-- Custom Fonts -->
  <link href="../font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
  <link href='https://fonts.googleapis.com/css?family=Kaushan+Script' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700' rel='stylesheet' type='text/css'>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/klemtoon_logos/favicon/favicon-32x32.png">

  <style>
    @font-face {
      font-family: "tall-films-expanded";
      src: url('../fonts/tall-films-expanded.ttf');
    }

    body {
      font-family: "tall-films-expanded", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      color: black;
    }

    p {
      font-size: 20px;
      color: black;
      font-family: "Lucida Sans Unicode", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .confirmation-header {
      background: linear-gradient(135deg, #fed136 0%, #fec503 100%);
      padding: 60px 0;
      text-align: center;
      color: #222;
    }

    .confirmation-header i {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .confirmation-header h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 36px;
      margin-bottom: 15px;
    }

    .confirmation-header p {
      font-size: 18px;
      margin-bottom: 0;
    }

    .confirmation-container {
      padding: 60px 0;
      max-width: 900px;
      margin: 0 auto;
    }

    .next-steps {
      background: #fff;
      border: 2px solid #fed136;
      border-radius: 8px;
      padding: 40px;
      margin-bottom: 30px;
    }

    .next-steps h2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #222;
      margin-bottom: 30px;
      text-align: center;
    }

    .step {
      display: flex;
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 1px solid #e7e7e7;
    }

    .step:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .step-number {
      flex-shrink: 0;
      width: 50px;
      height: 50px;
      background-color: #fed136;
      color: #222;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin-right: 20px;
    }

    .step-content {
      flex-grow: 1;
    }

    .step-content h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #222;
      margin-bottom: 10px;
    }

    .step-content p {
      color: #666;
      font-size: 15px;
      margin-bottom: 0;
      line-height: 1.6;
    }

    .step-content ul {
      margin-top: 10px;
      margin-bottom: 0;
      color: #666;
    }

    .step-content ul li {
      margin-bottom: 5px;
    }

    .contact-info {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      margin-bottom: 30px;
    }

    .contact-info h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: #222;
      margin-bottom: 20px;
    }

    .contact-info p {
      color: #666;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .contact-info a {
      color: #fed136;
      font-weight: 700;
      text-decoration: none;
    }

    .contact-info a:hover {
      color: #fec503;
      text-decoration: underline;
    }

    .action-buttons {
      text-align: center;
      margin-top: 40px;
    }

    .action-buttons .btn {
      margin: 10px;
      padding: 12px 30px;
      font-weight: 700;
    }

    .highlight-box {
      background: #fffbf0;
      border-left: 4px solid #fed136;
      padding: 15px 20px;
      margin-top: 15px;
      border-radius: 4px;
    }

    .highlight-box strong {
      color: #222;
    }
  </style>
</head>

<body id="page-top">

  <!-- Header -->
  <div class="confirmation-header">
    <div class="container">
      <i class="fa fa-check-circle"></i>
      <h1>Bedankt voor uw inschrijving!</h1>
      <p>Uw vragenlijst is verzonden</p>
    </div>
  </div>

  <!-- Confirmation Content -->
  <div class="container confirmation-container">

    <!-- Next Steps -->
    <div class="next-steps">
      <h2>Volgende stappen</h2>
      <div id="steps-content"></div>
    </div>

    <!-- Contact Info -->
    <div class="contact-info">
      <h3><i class="fa fa-phone"></i> Vragen?</h3>
      <p>Heeft u nog vragen? Neem gerust contact met ons op:</p>
      <p>
        <i class="fa fa-envelope"></i> Email: <a href="mailto:info@deklemtoon.be">info@deklemtoon.be</a><br>
        <i class="fa fa-phone"></i> Telefoon: <a href="tel:+32474939384">0474 93 93 84</a>
      </p>
      <p style="margin-top: 20px;">
        <strong>Adres:</strong><br>
        Dijkstraat 23b<br>
        9700 Oudenaarde
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <a href="../index.html" class="btn btn-primary" style="background-color: #fed136; border-color: #fed136; color: #222;">
        <i class="fa fa-home"></i> Terug naar hoofdpagina
      </a>
      <a href="index.html" class="btn btn-default">
        <i class="fa fa-list"></i> Andere vragenlijst invullen
      </a>
    </div>

  </div>

  <!-- jQuery -->
  <script src="../js/jquery.js"></script>
  <!-- Bootstrap Core JavaScript -->
  <script src="../js/bootstrap.min.js"></script>

  <script>
    // Get questionnaire type from URL
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');

    // Next steps content for each type
    const nextSteps = {
      'articulatie': {
        title: 'Volgende stappen voor articulatiestoornissen',
        steps: [
          {
            title: 'Anamneseformulier is verzonden',
            content: 'U heeft zojuist het anamneseformulier ingevuld. We zullen dit doornemen ter voorbereiding van uw intake.'
          },
          {
            title: 'Voorschrift van de huisarts',
            content: `
              <p>Bezorg ons een <strong>voorschrift van uw huisarts</strong> voor logopedische behandeling.</p>
              <p style="margin-top: 15px;">
                <a href="../files/Voorschrift_Bilan.pdf" target="_blank" class="btn btn-sm" style="background-color: #fed136; border: none; color: #222; padding: 8px 20px; text-decoration: none; border-radius: 4px; display: inline-block;">
                  <i class="fa fa-download"></i> Download voorschrift formulier
                </a>
              </p>
              <div class="highlight-box">
                <strong>Let op:</strong> Afhankelijk van uw mutualiteit heeft u ook een <strong>mutualistenvignet</strong> nodig (sticker van uw ziekenfonds).
                Informeer bij uw mutualiteit of dit bij u van toepassing is.
              </div>
            `
          },
          {
            title: 'Opstartkosten betalen',
            content: `
              <p>Voor het opstarten van de behandeling vragen wij een eenmalige bijdrage van <strong>€50</strong>.</p>
              <p style="margin-top: 15px;"><strong>Overschrijving:</strong></p>
              <p style="margin-left: 20px;">
                Rekeningnummer: <strong>BE11 3632 2752 4048</strong><br>
                Met vermelding: "Opstartkosten + naam kind"
              </p>
              <p style="margin-top: 10px;"><strong>Of:</strong> Contant betalen bij uw eerste afspraak</p>
            `
          }
        ]
      },
      'leerstoornissen': {
        title: 'Volgende stappen voor leerstoornissen',
        steps: [
          {
            title: 'Anamneseformulier is verzonden',
            content: 'U heeft zojuist het anamneseformulier ingevuld. We zullen dit doornemen ter voorbereiding van uw intake.'
          },
          {
            title: 'Voorschrift van een specialist',
            content: `
              <p>Voor leerstoornissen heeft u een voorschrift nodig van een <strong>specialist</strong>:</p>
              <ul style="margin-left: 20px; margin-top: 10px;">
                <li><strong>Kinderarts</strong>, of</li>
                <li><strong>NKO-arts</strong> (neus-, keel- en oorarts)</li>
              </ul>
              <p style="margin-top: 15px;">
                <a href="../files/Voorschrift_Bilan.pdf" target="_blank" class="btn btn-sm" style="background-color: #fed136; border: none; color: #222; padding: 8px 20px; text-decoration: none; border-radius: 4px; display: inline-block;">
                  <i class="fa fa-download"></i> Download voorschrift formulier
                </a>
              </p>
              <div class="highlight-box">
                <strong>Belangrijk:</strong> Een voorschrift van de <strong>huisarts is NIET voldoende</strong> voor leerstoornissen.
                Het voorschrift moet afkomstig zijn van een kinderarts of NKO-arts. In bijlage bij het voorschrift is vaak een formulier vereist dat door de specialist moet worden ingevuld.
              </div>
            `
          },
          {
            title: 'Opstartkosten betalen',
            content: `
              <p>Voor het opstarten van de behandeling vragen wij een eenmalige bijdrage van <strong>€50</strong>.</p>
              <p style="margin-top: 15px;"><strong>Overschrijving:</strong></p>
              <p style="margin-left: 20px;">
                Rekeningnummer: <strong>BE11 3632 2752 4048</strong><br>
                Met vermelding: "Opstartkosten + naam kind"
              </p>
              <p style="margin-top: 10px;"><strong>Of:</strong> Contant betalen bij uw eerste afspraak</p>
            `
          }
        ]
      },
      'taalstoornissen': {
        title: 'Volgende stappen voor taalstoornissen',
        steps: [
          {
            title: 'Anamneseformulier is verzonden',
            content: 'U heeft zojuist het anamneseformulier ingevuld. We zullen dit doornemen ter voorbereiding van uw intake.'
          },
          {
            title: 'Voorschrift van NKO-arts + audiogram',
            content: `
              <p>Voor taalstoornissen heeft u een voorschrift nodig van een <strong>NKO-arts</strong> (neus-, keel- en oorarts).</p>
              <p style="margin-top: 15px;">
                <a href="../files/Voorschrift_Bilan.pdf" target="_blank" class="btn btn-sm" style="background-color: #fed136; border: none; color: #222; padding: 8px 20px; text-decoration: none; border-radius: 4px; display: inline-block;">
                  <i class="fa fa-download"></i> Download voorschrift formulier
                </a>
              </p>
              <div class="highlight-box">
                <strong>Verplicht:</strong> Bij het voorschrift moet een recent <strong>audiogram</strong> (gehoortest) gevoegd zijn.
                Dit is noodzakelijk om gehoorgerelateerde oorzaken uit te sluiten.
              </div>
            `
          },
          {
            title: 'Opstartkosten betalen',
            content: `
              <p>Voor het opstarten van de behandeling vragen wij een eenmalige bijdrage van <strong>€50</strong>.</p>
              <p style="margin-top: 15px;"><strong>Overschrijving:</strong></p>
              <p style="margin-left: 20px;">
                Rekeningnummer: <strong>BE11 3632 2752 4048</strong><br>
                Met vermelding: "Opstartkosten + naam kind"
              </p>
              <p style="margin-top: 10px;"><strong>Of:</strong> Contant betalen bij uw eerste afspraak</p>
            `
          },
          {
            title: 'IQ-onderzoek door psycholoog',
            content: `
              <p>Voor de behandeling van taalstoornissen is een <strong>IQ-onderzoek</strong> door een psycholoog vereist.</p>
              <div class="highlight-box">
                <strong>Waarom?</strong> Dit onderzoek helpt om de aard van de taalstoornis beter te kunnen inschatten en de behandeling optimaal af te stemmen op de mogelijkheden van uw kind.
              </div>
              <p style="margin-top: 15px;">Als dit nog niet gebeurd is, kunnen wij u doorverwijzen naar een psycholoog die gespecialiseerd is in deze onderzoeken.</p>
            `
          }
        ]
      }
    };

    // Render steps based on type
    function renderSteps() {
      const stepsContent = document.getElementById('steps-content');

      if (!type || !nextSteps[type]) {
        stepsContent.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #666;">
            <p>De volgende stappen kunnen niet worden weergegeven. Neem contact op met de praktijk voor meer informatie.</p>
          </div>
        `;
        return;
      }

      const steps = nextSteps[type].steps;
      let html = '';

      steps.forEach((step, index) => {
        html += `
          <div class="step">
            <div class="step-number">${index + 1}</div>
            <div class="step-content">
              <h3>${step.title}</h3>
              ${step.content}
            </div>
          </div>
        `;
      });

      stepsContent.innerHTML = html;
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', renderSteps);
  </script>

</body>
</html>
